spring:
  main:
    web-application-type: none   # desktop app: no HTTP server
  application:
    name: curious-tunes
  datasource:
    url: jdbc:h2:file:~/ctunes/${DATABASE_FILE};DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  sql.init.mode: always
  jpa.defer-datasource-initialization: false
  title: cTunes

ctunes:
  h2-console: # H2's own web console (H2DevConsole), for development
    enabled: ${H2_CONSOLE_ENABLED}
    port: ${H2_CONSOLE_PORT:8082}

logging.level:
  org.jooq.Constants: off
  com:
    github:
      curiousoddman:
        curious_tunes:
          ui:
            controller:
              element: debug
          model:
            playlist: debug

